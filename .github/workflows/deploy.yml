name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_run:
    workflows:
      - Refresh public data
    types:
      - completed
  workflow_dispatch:
    inputs:
      code_ref:
        description: Code branch, tag, or commit SHA to deploy
        required: true
        default: master
        type: string
      data_ref:
        description: Data branch or commit SHA to deploy
        required: true
        default: data
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and gate Pages artifact
    if: >-
      ${{ github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out trusted code revision
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'push' && github.sha ||
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_sha || inputs.code_ref }}
          path: code
          persist-credentials: false

      - name: Check out public data revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.data_ref || 'data' }}
          path: data-state
          persist-credentials: false

      - name: Record immutable deployment inputs
        run: |
          echo "### Deployment inputs" >> "$GITHUB_STEP_SUMMARY"
          echo "- Code: \`$(git -C code rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Data: \`$(git -C data-state rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install pinned runtime dependencies
        working-directory: code
        run: python -m pip install -r requirements.txt

      - name: Check installed dependencies
        working-directory: code
        run: python -m pip check

      - name: Hydrate public data only
        working-directory: code
        run: |
          test -f ../data-state/data/history.json
          test -f ../data-state/data/dashboard_data.json
          test ! -e ../data-state/data/collection.json
          cp ../data-state/data/history.json data/history.json
          cp ../data-state/data/dashboard_data.json data/dashboard_data.json
          rm -f data/collection.json

      - name: Validate payload and build site
        working-directory: code
        run: |
          python -m mom_index validate data/dashboard_data.json
          python scripts/build_site.py --out _site
          python scripts/check_site.py _site
          node --check frontend/assets/app.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: code/_site

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
