name: Refresh public data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Guba data and preserve LKG
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out fixed code revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: code
          persist-credentials: false

      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-state
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            code/requirements.txt
            code/requirements-dev.txt

      - name: Install pinned development dependencies
        working-directory: code
        run: python -m pip install -r requirements-dev.txt

      - name: Check installed dependencies
        working-directory: code
        run: python -m pip check

      - name: Hydrate last-known-good public state
        working-directory: code
        run: |
          test -f ../data-state/data/history.json
          test -f ../data-state/data/dashboard_data.json
          test ! -e ../data-state/data/collection.json
          cp ../data-state/data/history.json data/history.json
          cp ../data-state/data/dashboard_data.json data/dashboard_data.json
          rm -f data/collection.json

      - name: Collect public Guba data
        working-directory: code
        run: python -m mom_index collect --sources guba --out data

      - name: Build and validate public payload
        working-directory: code
        run: |
          python -m mom_index build --data data --out data/dashboard_data.json
          python -m mom_index validate data/dashboard_data.json

      - name: Gate the generated site
        working-directory: code
        run: |
          python scripts/build_site.py --out _site
          python scripts/check_site.py _site
          node --check frontend/assets/app.js

      - name: Commit public state to the data branch
        working-directory: data-state
        run: |
          test ! -e ../code/_site/data/collection.json
          test ! -e ../code/data/collection.json.lock
          cp ../code/data/history.json data/history.json
          cp ../code/data/dashboard_data.json data/dashboard_data.json
          git add -- data/history.json data/dashboard_data.json

          while IFS= read -r staged_path; do
            case "$staged_path" in
              data/history.json|data/dashboard_data.json) ;;
              *)
                echo "Refusing to commit unexpected path: $staged_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)

          if git diff --cached --quiet; then
            echo "Public payload is unchanged; no data commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh public dashboard"
          git push origin HEAD:data
