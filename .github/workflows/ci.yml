name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python, site, and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run test suite
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q mom_index scripts tests pipeline.py

      - name: Build static site
        run: python scripts/build_site.py --out _site

      - name: Smoke-check static site
        run: python scripts/check_site.py _site

      - name: Check browser JavaScript syntax
        run: node --check frontend/assets/app.js

      - name: Parse workflow YAML
        run: >-
          python -c "import pathlib,yaml;
          [yaml.safe_load(path.read_text()) for path in
          pathlib.Path('.github/workflows').glob('*.yml')];
          print('workflow yaml: OK')"
